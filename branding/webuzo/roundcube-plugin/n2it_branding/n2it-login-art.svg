<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- N2IT hosting sign-in artwork (same style as voip.n2it.co.za): cloud, server rack, globe (left),
       envelope, website, mobile mail (right), linked towards the sign-in box by dashed network lines. -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- network lines -->
    <g stroke-opacity="0.13" stroke-width="2" stroke-dasharray="2 10">
      <path d="M345 185 C 450 190, 520 260, 580 330"/>
      <path d="M300 600 C 420 600, 500 560, 580 520"/>
      <path d="M414 425 C 480 425, 530 425, 580 425"/>
      <path d="M1255 215 C 1150 220, 1080 270, 1020 330"/>
      <path d="M1330 600 C 1200 600, 1100 560, 1020 520"/>
      <path d="M1166 425 C 1110 425, 1060 425, 1020 425"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.18" stroke="none">
      <circle cx="580" cy="330" r="5"/><circle cx="580" cy="520" r="5"/><circle cx="580" cy="425" r="5"/>
      <circle cx="1020" cy="330" r="5"/><circle cx="1020" cy="520" r="5"/><circle cx="1020" cy="425" r="5"/>
    </g>

    <g stroke-opacity="0.2" stroke-width="3.5">
      <!-- cloud -->
      <path d="M170 235 H320 A45 45 0 0 0 322 145 A65 65 0 0 0 200 125 A60 60 0 0 0 170 235 Z"/>
      <path d="M215 195 l20 -20 l20 20 M235 175 v40" stroke-opacity="0.16"/>

      <!-- server rack -->
      <rect x="110" y="520" width="190" height="56" rx="9"/>
      <rect x="110" y="588" width="190" height="56" rx="9"/>
      <rect x="110" y="656" width="190" height="56" rx="9"/>
      <path d="M200 548 h75 M200 616 h75 M200 684 h75" stroke-opacity="0.14"/>
      <g fill="#ffffff" fill-opacity="0.2" stroke="none">
        <circle cx="140" cy="548" r="6"/><circle cx="140" cy="616" r="6"/><circle cx="140" cy="684" r="6"/>
      </g>
      <path d="M140 712 v18 M270 712 v18"/>

      <!-- globe (web) -->
      <circle cx="366" cy="425" r="48"/>
      <ellipse cx="366" cy="425" rx="20" ry="48" stroke-opacity="0.16"/>
      <path d="M318 425 h96 M326 400 q40 10 80 0 M326 450 q40 -10 80 0" stroke-opacity="0.16"/>

      <!-- envelope (email) -->
      <rect x="1262" y="140" width="186" height="128" rx="12"/>
      <path d="M1266 150 L1355 218 L1444 150"/>
      <path d="M1266 262 L1328 200 M1444 262 L1382 200" stroke-opacity="0.14"/>

      <!-- browser window (website) -->
      <rect x="1168" y="370" width="164" height="112" rx="8"/>
      <path d="M1168 394 h164"/>
      <g fill="#ffffff" fill-opacity="0.2" stroke="none">
        <circle cx="1184" cy="382" r="4"/><circle cx="1197" cy="382" r="4"/><circle cx="1210" cy="382" r="4"/>
      </g>
      <path d="M1186 414 h64 M1186 432 h120 M1186 450 h96 M1186 466 h70" stroke-opacity="0.14"/>

      <!-- mobile phone with mail -->
      <rect x="1340" y="500" width="112" height="200" rx="18"/>
      <path d="M1381 520 h30"/>
      <circle cx="1396" cy="680" r="7"/>
      <rect x="1366" y="572" width="60" height="42" rx="5" stroke-opacity="0.16"/>
      <path d="M1368 576 l28 20 l28 -20" stroke-opacity="0.16"/>
      <circle cx="1446" cy="508" r="11" fill="#ffffff" fill-opacity="0.12" stroke-opacity="0.2"/>
    </g>
  </g>
</svg>
