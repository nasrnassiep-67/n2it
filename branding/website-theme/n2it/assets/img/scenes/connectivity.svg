<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 0 340 240" fill="none"><style>
.plate{fill:#f3f6fa;stroke:#c8d3e2}.grid{stroke:#dfe5ee;fill:none}
.b polygon,.pn{stroke:#0f3d80;stroke-width:1.1;stroke-linejoin:round}
.b .t{fill:#fff}.b .l{fill:#e6eef9}.b .r{fill:#cfdff3}
.hi .t{fill:#2f6fd0}.hi .l{fill:#0f3d80}.hi .r{fill:#0a2a5a}.hi polygon{stroke:#061a3a}
.pn{fill:#fff}.ink{stroke:#0f3d80;fill:none;stroke-width:1.4;stroke-linecap:round}
.ln{fill:none;stroke:#7fa6d8;stroke-width:1.2;stroke-dasharray:3 4}
.fib{fill:none;stroke:#145ab6;stroke-width:2.2;stroke-linecap:round}
.pk{fill:#2f8fe0}.ok{fill:#10b981}.bad{fill:#e5484d}
.led{fill:#10b981;animation:bl 1.6s steps(2) infinite}.ledb{fill:#2f8fe0;animation:bl 1.1s steps(2) infinite}
@keyframes bl{50%{opacity:.15}}
.rip{fill:none;stroke:#2f8fe0;stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:rp 2.7s ease-out infinite}
@keyframes rp{0%{transform:scale(.15);opacity:.9}100%{transform:scale(1);opacity:0}}
.cloud path{fill:#fff;stroke:#145ab6;stroke-width:1.4}.cloud{animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-5px)}}
.wave{fill:none;stroke:#2f8fe0;stroke-width:1.6;stroke-linecap:round;animation:wv 1.4s ease-out infinite}
@keyframes wv{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.type{stroke-dasharray:60;stroke-dashoffset:60;animation:ty 4.5s ease-in-out infinite}
@keyframes ty{40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.cur{fill:#145ab6;animation:bl .9s steps(2) infinite}
.bar{transform-box:fill-box;transform-origin:bottom;animation:gr 4.5s ease-in-out infinite}
@keyframes gr{0%{transform:scaleY(.2)}50%,85%{transform:scaleY(1)}100%{transform:scaleY(.2)}}
.cone{fill:#2f8fe0;fill-opacity:.16;stroke:#2f8fe0;stroke-opacity:.5;transform-box:view-box;animation:sw 5s ease-in-out infinite alternate}
.cam{animation:sw 5s ease-in-out infinite alternate;transform-box:view-box}
@keyframes sw{0%{transform:rotate(-7deg)}100%{transform:rotate(7deg)}}
.shield{fill:#145ab6;stroke:#061a3a;stroke-width:1.2;animation:sh 2.2s ease-in-out infinite}
@keyframes sh{50%{filter:drop-shadow(0 0 6px #2f8fe0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}circle[class~=pk],circle[class~=ok],circle[class~=bad],.env{display:none}}
