<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; connect-src wss://*.voip.n2it.co.za:*; media-src 'self' blob:; style-src 'self' 'unsafe-inline'">
<title>N2IT Phone</title>
<style>
  body{font:15px system-ui;margin:0;padding:16px;background:#fff;color:#111}
  input{width:100%;box-sizing:border-box;padding:8px;margin:4px 0}
  button{padding:10px;margin:3px;border:0;border-radius:8px;background:#e8e8ec;cursor:pointer}
  button.go{background:#2e9e4f;color:#fff}#signin,#s-save{background:#145ab6;color:#fff}h2{color:#0f3d80}button.end{background:#d33;color:#fff}button.on{background:#222;color:#fff}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pad button{font-size:20px}
  label{display:block;margin:8px 0;font-size:13px}select{width:100%;padding:6px}label input[type=checkbox]{width:auto}
  .version{font-size:12px;color:#888;text-align:center;margin-top:16px}
  #status{font-size:13px;color:#666;margin-bottom:8px}#status.dnd{color:#e65100;font-weight:bold}#status.dnd::after{content:" · Do Not Disturb"}
  #dnd-banner{background:#e65100;color:#fff;padding:8px 10px;border-radius:8px;margin-bottom:8px;font-size:13px}
  #dnd-banner button{background:#fff;color:#e65100;padding:4px 10px;margin:4px 0 0}button.dndon{background:#e65100;color:#fff}
  .contact{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #eee}
  #waiting{background:#fff4e5;border:1px solid #f0b357;border-radius:8px;padding:8px;margin-bottom:8px}
  #other-note{background:#eef3fb;border-radius:8px;padding:8px;margin-bottom:8px;font-size:13px;color:#0f3d80}
  .contact small{color:#666}.contact button{margin:0}#c-list{max-height:480px;overflow-y:auto}.hidden{display:none}#num{font-size:22px;text-align:center}
</style></head><body>
<div id="status">Not registered</div>

<section id="login">
  <img src="assets/logo.png" alt="N2IT" style="display:block;width:220px;margin:8px auto 12px">
  <h2>Sign in</h2>
  <input id="tenant" placeholder="Company code" autocapitalize="off">
  <input id="user" placeholder="Extension">
  <input id="pass" type="password" placeholder="Password">
  <div id="domain" style="font-size:12px;color:#666"></div>
  <button class="go" id="signin">Sign in</button><button class="hidden" id="login-cancel">Cancel</button>
  <div class="version"></div>
</section>

<section id="phone" class="hidden">
  <div id="dnd-banner" class="hidden"><b>DND enabled. Please disable DND to receive calls.</b><br>
    <span id="dnd-until"></span><br><button id="dnd-off">Turn off</button></div>
  <div id="idle">
    <input id="num" placeholder="Number">
    <div class="pad" id="pad"></div>
    <button class="go" id="call">Call</button><button id="contacts-open">Contacts</button><button id="vm">Voicemail</button><button id="cfg">Settings</button><button id="dnd">Do Not Disturb</button>
  </div>
  <div id="incall" class="hidden">
    <div id="waiting" class="hidden"><b id="w-who"></b><br>
      <button class="go" id="w-answer">Answer (current call on hold)</button><button class="end" id="w-decline">Decline</button><button id="w-silence">Silence</button></div>
    <div id="other-note" class="hidden"></div>
    <h2 id="who"></h2><div id="state"></div>
    <button id="mute">Mute</button><button id="hold">Hold</button><button id="xfer">Transfer</button><button id="add">Add</button><button id="audio">Audio</button>
    <div id="audio-pick" class="hidden">
      <label>Microphone <select id="a-mic"></select></label>
      <label>Speaker <select id="a-spk"></select></label>
    </div>
    <div id="xfer-pick" class="hidden">
      <input id="x-num" placeholder="Transfer to extension or number">
      <button id="x-blind">Transfer now</button><button class="go" id="x-ask">Ask first</button><button id="x-cancel">Cancel</button>
    </div>
    <button class="go hidden" id="x-complete">Complete transfer</button>
    <button class="go hidden" id="merge">Merge calls</button>
    <div class="pad" id="dpad"></div>
    <button class="go hidden" id="answer">Answer</button><button class="end" id="hang">Hang up</button>
  </div>
</section>
<section id="contacts" class="hidden">
  <h2>Company contacts</h2>
  <input id="c-search" placeholder="Search name or number">
  <div id="c-msg" style="font-size:13px;color:#666"></div>
  <div id="c-list"></div>
  <button id="c-back">Back</button>
</section>
<section id="dnd-pick" class="hidden">
  <h2>Do Not Disturb</h2>
  <div style="font-size:13px;color:#666">Calls to this app go to voicemail until the time you choose (at most 2 weeks).
    Other phones on your extension still ring.</div>
  <button data-hours="1">1 hour</button><button data-hours="2">2 hours</button><button data-hours="4">4 hours</button>
  <button id="dnd-morning"></button>
  <label>Or until <input type="datetime-local" id="dnd-at"></label>
  <button class="go" id="dnd-set">Set</button><button class="end hidden" id="dnd-stop">Turn off now</button><button id="dnd-back">Back</button>
</section>
<section id="settings" class="hidden">
  <h2>Settings</h2>
  <label>Microphone <select id="s-mic"></select></label>
  <label>Speaker <select id="s-spk"></select></label>
  <label><input type="checkbox" id="s-echo"> Echo cancellation</label>
  <label><input type="checkbox" id="s-noise"> Noise suppression</label>
  <label><input type="checkbox" id="s-agc"> Automatic gain control</label>
  <label>WSS port <input id="s-port" inputmode="numeric"></label>
  <label>Voicemail number <input id="s-vm"></label>
  <label>STUN server <input id="s-stun" placeholder="stun:host:port (blank = none)"></label>
  <div id="s-links" class="hidden" style="font-size:13px;margin:8px 0">
    <span id="s-links-msg"></span><br><button id="s-links-set">Phone links: open with N2IT Phone</button>
  </div>
  <button class="go" id="s-save">Save</button><button id="s-back">Back</button>
  <hr><h2>Accounts</h2>
  <div style="font-size:13px;color:#666">Only the active account receives calls.</div>
  <div id="s-accounts"></div>
  <button id="s-add">Add account</button>
  <div class="version"></div>
</section>
<script src="vendor/jssip.min.js"></script>
<script src="app.js"></script>
</body></html>
