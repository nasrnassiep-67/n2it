name: iOS build
on:
  push:
    branches: [main]
    paths: ['N2IT/**', 'project.yml', 'Config/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      adhoc:
        description: Build a signed Ad Hoc .ipa (needs the Apple secrets)
        type: boolean
        default: false

jobs:
  # Always runs, needs no Apple account: proves the app compiles against the Linphone SDK.
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild build -project N2IT.xcodeproj -scheme N2IT \
            -destination 'generic/platform=iOS' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tee build.log | tail -n 40
          exit ${PIPESTATUS[0]}
      - name: Show compile errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -40

  # Manual: Actions > "iOS build" > Run workflow > adhoc = true. Needs every target iPhone's UDID
  # registered in the developer account; the .ipa is published to voip.n2it.co.za/app/ by hand.
  adhoc:
    if: github.event_name == 'workflow_dispatch' && inputs.adhoc
    needs: compile
    runs-on: macos-15
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!v}" ] || { echo "::error::Missing GitHub secret for $v"; exit 1; }
          done
      - run: brew install xcodegen
      - name: Generate project
        run: |
          # Ad Hoc builds use Apple's production push service.
          sed -i '' 's/aps-environment: development/aps-environment: production/' project.yml
          xcodegen generate
      - name: Install App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Archive (cloud-managed signing)
        run: |
          xcodebuild archive -project N2IT.xcodeproj -scheme N2IT -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/N2IT.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Export Ad Hoc .ipa
        run: |
          sed "s/__TEAM_ID__/$TEAM_ID/" ci/ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive -archivePath build/N2IT.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: N2IT-adhoc-ipa
          path: build/export/*.ipa
