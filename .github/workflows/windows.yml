name: Desktop installers
on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: windows/package-lock.json }
      - run: npm ci
      - name: Build NSIS installer (unsigned)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Download from the run's Artifacts section; SmartScreen will warn (unsigned): More info > Run anyway.
      - uses: actions/upload-artifact@v4
        with:
          name: n2it-phone-windows-installer
          path: windows/dist/*.exe

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: windows/package-lock.json }
      - run: npm ci
      - name: Syntax check
        run: for f in src/*.js; do node --check "$f"; done
      - name: Syntax check build hooks
        run: for f in build/*.js; do node --check "$f"; done
      # bsdtar for the Arch (.pacman) package
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Build AppImage, .deb and .pacman
        run: npm run dist:linux
      # Download from the run's Artifacts section. AppImage: chmod +x, then run. Deb: sudo apt install ./file.deb
      # Arch/Omarchy: sudo pacman -U ./file.pacman
      - uses: actions/upload-artifact@v4
        with:
          name: n2it-phone-linux
          path: |
            windows/dist/*.AppImage
            windows/dist/*.deb
            windows/dist/*.pacman

  mac:
    runs-on: macos-15
    env:
      MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: windows/package-lock.json }
      - run: npm ci
      # With the Developer ID secrets set (see windows/build/notarise.js), the .dmg files are signed, notarised and
      # stapled, so client Macs open them without "Apple could not verify…". Without them: ad-hoc signed as before.
      - name: Import the Developer ID certificate
        if: env.MAC_CERT_P12_BASE64 != ''
        env:
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KP="$(uuidgen)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGNED=1" >> "$GITHUB_ENV"
      - name: Build .dmg for Apple Silicon and Intel (Developer ID, notarised)
        if: env.SIGNED == '1'
        run: npm run dist:mac && node build/notarise.js
        env:
          CSC_NAME: Nasr Nassiep (8URJCQ48GM)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      - name: Build .dmg for Apple Silicon and Intel (ad-hoc signed, not notarised)
        if: env.SIGNED != '1'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Ad-hoc only: first open says it can't verify the developer; System Settings > Privacy & Security > Open Anyway.
      - uses: actions/upload-artifact@v4
        with:
          name: n2it-phone-mac
          path: windows/dist/*.dmg

  # Stable download links (no GitHub login needed, unlike run artifacts). Main only.
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [build, linux, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish as the "desktop-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          cp *.exe n2it-phone-setup.exe
          cp *.AppImage n2it-phone.AppImage
          cp *.deb n2it-phone.deb
          cp *.pacman n2it-phone.pacman
          gh release delete desktop-latest --cleanup-tag -y || true
          gh release create desktop-latest n2it-phone-setup.exe n2it-phone.AppImage n2it-phone.deb n2it-phone.pacman \
            n2it-phone-mac-arm64.dmg n2it-phone-mac-x64.dmg --prerelease \
            --title "N2IT Phone desktop (latest test build)" \
            --notes "Build of commit ${GITHUB_SHA::7}. Windows: run n2it-phone-setup.exe (SmartScreen: More info > Run anyway). Linux: .deb (Ubuntu/Debian), .pacman (Arch/Omarchy) or AppImage (chmod +x; needs fuse2/libfuse2). macOS: n2it-phone-mac-arm64.dmg (Apple Silicon, M1 and later) or n2it-phone-mac-x64.dmg (Intel); drag to Applications, open once, then System Settings > Privacy & Security > Open Anyway."
