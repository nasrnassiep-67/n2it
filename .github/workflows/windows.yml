name: Desktop installers
on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: windows/package-lock.json }
      - run: npm ci
      - name: Build NSIS installer (unsigned)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Download from the run's Artifacts section; SmartScreen will warn (unsigned): More info > Run anyway.
      - uses: actions/upload-artifact@v4
        with:
          name: n2it-phone-windows-installer
          path: windows/dist/*.exe

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: windows/package-lock.json }
      - run: npm ci
      - name: Syntax check
        run: for f in src/*.js; do node --check "$f"; done
      - name: Build AppImage and .deb
        run: npm run dist:linux
      # Download from the run's Artifacts section. AppImage: chmod +x, then run. Deb: sudo apt install ./file.deb
      - uses: actions/upload-artifact@v4
        with:
          name: n2it-phone-linux
          path: |
            windows/dist/*.AppImage
            windows/dist/*.deb

  # Stable download links (no GitHub login needed, unlike run artifacts). Main only.
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [build, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish as the "desktop-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          cp *.exe n2it-phone-setup.exe
          cp *.AppImage n2it-phone.AppImage
          cp *.deb n2it-phone.deb
          gh release delete desktop-latest --cleanup-tag -y || true
          gh release create desktop-latest n2it-phone-setup.exe n2it-phone.AppImage n2it-phone.deb --prerelease \
            --title "N2IT Phone desktop (latest test build)" \
            --notes "Build of commit ${GITHUB_SHA::7}. Windows: run n2it-phone-setup.exe (SmartScreen: More info > Run anyway). Linux: AppImage (chmod +x) or .deb."
