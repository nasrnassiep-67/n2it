name: N2IT
options:
  bundleIdPrefix: za.co.n2it
  deploymentTarget: { iOS: "16.0" }
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git   # Google's WebRTC (BSD) built for iOS
    exactVersion: 154.0.0
targets:
  N2IT:
    type: application
    platform: iOS
    sources: [N2IT]
    dependencies:
      - package: WebRTC
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: za.co.n2it.softphone
      DEVELOPMENT_TEAM: 8URJCQ48GM   # N2IT Apple developer team (paid, individual)
      CODE_SIGN_STYLE: Automatic
      ENABLE_BITCODE: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "0.3.4"   # Recents: last 30 days (max 3000), was the last 100
      CURRENT_PROJECT_VERSION: "4"
    entitlements:
      path: N2IT/N2IT.entitlements
      properties:
        aps-environment: development
    info:
      path: N2IT/Info.plist
      properties:
        CFBundleDisplayName: N2IT Phone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # WebRTC links the camera APIs (video calls); App Store Connect fails a build without this text even though
        # N2IT never turns the camera on (ITMS-90683, 0.3.0 upload 2026-10-22)
        NSCameraUsageDescription: N2IT Phone does not use the camera; this is required by the calling library.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: N2IT Phone needs the microphone for calls.
        NSContactsUsageDescription: N2IT Phone shows your contacts for dialling.
        UIBackgroundModes: [audio, voip]
        PushGatewayHost: $(PUSH_GATEWAY_HOST)
        SIPTenant: $(SIP_TENANT)
        SIPUser: $(SIP_USER)
        SIPPassword: $(SIP_PASSWORD)
