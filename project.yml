name: N2IT
options:
  bundleIdPrefix: za.co.n2it
  deploymentTarget: { iOS: "16.0" }
packages:
  linphonesw:
    url: https://gitlab.linphone.org/BC/public/linphone-sdk-swift-ios.git
    from: 5.3.0
targets:
  N2IT:
    type: application
    platform: iOS
    sources: [N2IT]
    dependencies:
      - package: linphonesw
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: za.co.n2it.softphone
      DEVELOPMENT_TEAM: 69Y3USPRR5   # N2IT Apple developer team
      CODE_SIGN_STYLE: Automatic
      ENABLE_BITCODE: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: N2IT/N2IT.entitlements
      properties:
        aps-environment: development
    info:
      path: N2IT/Info.plist
      properties:
        CFBundleDisplayName: N2IT Phone
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: N2IT Phone needs the microphone for calls.
        NSContactsUsageDescription: N2IT Phone shows your contacts for dialling.
        UIBackgroundModes: [audio, voip]
        PushGatewayHost: $(PUSH_GATEWAY_HOST)
        SIPTenant: $(SIP_TENANT)
        SIPUser: $(SIP_USER)
        SIPPassword: $(SIP_PASSWORD)
